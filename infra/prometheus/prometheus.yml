# 抓取本机运行的 Spring Boot（默认 8080）
# Docker 内使用 host.docker.internal；Linux 需在 compose 中配置 extra_hosts
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: speaking-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
    relabel_configs:
      - target_label: service
        replacement: speaking-killer-api
