# Prometheus + Grafana，监控本机 speaker 后端（需先启动 Java :8080）
# 启动：docker compose -f infra/docker-compose.yml up -d
# Grafana: http://localhost:3000  默认 admin / admin（首次登录可改密）
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: speaker-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.0.0
    container_name: speaker-grafana
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data: {}
